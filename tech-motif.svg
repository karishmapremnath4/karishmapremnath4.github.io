<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860">
  <!-- Scatter tile. Symbols are defined once at the origin and placed with
       <use>, so the layout can be varied without redrawing anything. Nothing
       crosses a tile edge, so it repeats cleanly in both directions. -->
  <defs>
    <g id="balloon" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-48" y1="0" x2="-21" y2="0"/>
      <circle cx="0" cy="0" r="21"/>
      <line x1="-21" y1="0" x2="21" y2="0"/>
      <line x1="21" y1="0" x2="48" y2="0" stroke-dasharray="4 3"/>
    </g>

    <g id="valve" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-44" y1="0" x2="-18" y2="0"/>
      <path d="M-18 -12 L-18 12 L0 0 Z"/>
      <path d="M18 -12 L18 12 L0 0 Z"/>
      <line x1="18" y1="0" x2="44" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="-20"/>
      <path d="M-13 -30 h26 a5 5 0 0 1 0 10 h-26 a5 5 0 0 1 0 -10 z"/>
    </g>

    <g id="rung" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-42" y1="-24" x2="-42" y2="24"/>
      <line x1="42" y1="-24" x2="42" y2="24"/>
      <line x1="-42" y1="0" x2="-20" y2="0"/>
      <line x1="-20" y1="-8" x2="-20" y2="8"/>
      <line x1="-12" y1="-8" x2="-12" y2="8"/>
      <line x1="-12" y1="0" x2="18" y2="0"/>
      <path d="M18 -8 A 8 8 0 0 0 18 8"/>
      <path d="M26 -8 A 8 8 0 0 1 26 8"/>
      <line x1="26" y1="0" x2="42" y2="0"/>
    </g>

    <g id="opamp" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-38" y1="-10" x2="-20" y2="-10"/>
      <line x1="-38" y1="10" x2="-20" y2="10"/>
      <path d="M-20 -24 L-20 24 L22 0 Z"/>
      <line x1="22" y1="0" x2="40" y2="0"/>
      <line x1="-15" y1="-10" x2="-7" y2="-10"/>
      <line x1="-15" y1="10" x2="-7" y2="10"/>
      <line x1="-11" y1="6" x2="-11" y2="14"/>
    </g>

    <g id="net" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-30" y1="-30" x2="0" y2="-15"/><line x1="-30" y1="-30" x2="0" y2="15"/>
      <line x1="-30" y1="0" x2="0" y2="-15"/><line x1="-30" y1="0" x2="0" y2="15"/>
      <line x1="-30" y1="30" x2="0" y2="-15"/><line x1="-30" y1="30" x2="0" y2="15"/>
      <line x1="0" y1="-15" x2="30" y2="0"/><line x1="0" y1="15" x2="30" y2="0"/>
      <circle cx="-30" cy="-30" r="4"/><circle cx="-30" cy="0" r="4"/><circle cx="-30" cy="30" r="4"/>
      <circle cx="0" cy="-15" r="4"/><circle cx="0" cy="15" r="4"/><circle cx="30" cy="0" r="4"/>
    </g>

    <g id="arm" fill="none" stroke="#14425c" stroke-width="1.15" stroke-linejoin="round">
      <line x1="-20" y1="30" x2="20" y2="30"/>
      <path d="M-10 30 L10 30 L6 16 L-6 16 Z"/>
      <line x1="0" y1="16" x2="-24" y2="-24"/>
      <line x1="-24" y1="-24" x2="16" y2="-52"/>
      <circle cx="0" cy="16" r="4"/>
      <circle cx="-24" cy="-24" r="4"/>
      <line x1="16" y1="-52" x2="28" y2="-59"/>
      <line x1="16" y1="-52" x2="26" y2="-43"/>
    </g>

    <g id="dip" fill="none" stroke="#14425c" stroke-width="1.15">
      <rect x="-22" y="-20" width="44" height="40" rx="2"/>
      <path d="M-7 -20 a7 7 0 0 0 14 0"/>
      <line x1="-30" y1="-10" x2="-22" y2="-10"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <line x1="-30" y1="10" x2="-22" y2="10"/>
      <line x1="22" y1="-10" x2="30" y2="-10"/>
      <line x1="22" y1="0" x2="30" y2="0"/>
      <line x1="22" y1="10" x2="30" y2="10"/>
    </g>

    <g id="pid" fill="none" stroke="#14425c" stroke-width="1.15">
      <line x1="-60" y1="0" x2="-44" y2="0"/>
      <circle cx="-36" cy="0" r="8"/>
      <line x1="-42" y1="0" x2="-30" y2="0"/>
      <line x1="-36" y1="-6" x2="-36" y2="6"/>
      <line x1="-28" y1="0" x2="-18" y2="0"/>
      <rect x="-18" y="-14" width="38" height="28" rx="1.5"/>
      <line x1="20" y1="0" x2="36" y2="0"/>
      <path d="M30 0 L30 32 L-36 32 L-36 8"/>
    </g>
  </defs>

  <use href="#balloon" transform="translate(110 90)"/>
  <use href="#rung"    transform="translate(330 70)"/>
  <use href="#dip"     transform="translate(560 110)"/>
  <use href="#net"     transform="translate(150 300)"/>
  <use href="#opamp"   transform="translate(390 290)"/>
  <use href="#valve"   transform="translate(600 320)"/>
  <use href="#arm"     transform="translate(120 560)"/>
  <use href="#pid"     transform="translate(380 540)"/>
  <use href="#balloon" transform="translate(610 600)"/>
  <use href="#rung"    transform="translate(250 760)"/>
  <use href="#net"     transform="translate(560 780)"/>

  <g fill="#14425c" font-family="ui-monospace, Menlo, monospace" font-size="9"
     text-anchor="middle" letter-spacing="0.4">
    <text x="110" y="87">TT</text><text x="110" y="99">101</text>
    <text x="610" y="597">FIC</text><text x="610" y="609">301</text>
    <text x="381" y="544">PID</text>
  </g>
</svg>
